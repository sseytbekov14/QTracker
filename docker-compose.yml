services:
  db:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - qtracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-QTracker}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "${DB_PORT:-5432}:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:8080"
    volumes:
      - qtracker_uploads:${FILE_UPLOAD_DIR:-/app/uploads}
    restart: unless-stopped

volumes:
  qtracker_pgdata:
  qtracker_uploads:
