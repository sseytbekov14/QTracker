logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.kpmg.qtracker: WARN
    com.kpmg.qtracker.service.ReminderNotificationService: WARN
    com.kpmg.qtracker.scheduler.ControlReminderScheduler: WARN
spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:qtracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false

auth:
  username-login:
    enabled: true

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:target/test-uploads}

# The scenarios make many writes and uploads as one person within a minute; RateLimitingFilterTest covers the
# limits themselves, ReleaseScenarioAuthIT the sign-in limit (kept at its default)
rate-limit:
  api-write: 100000
  user-list: 100000
  heavy: 100000

# The tests run the outbox dispatcher themselves (EmailOutboxDispatcher.dispatchPending) with their own Clock
notifications:
  dispatcher:
    enabled: false
