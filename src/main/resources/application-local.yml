spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            trust: smtp.gmail.com

notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
    whitelist-enforced: false
    whitelist: ${NOTIFICATIONS_EMAIL_WHITELIST:}
