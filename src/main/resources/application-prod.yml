spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  base-url: ${APP_BASE_URL}

# Sign-in with Microsoft Entra ID; AUTH_PASSWORD_ENABLED=true with AUTH_SSO_ENABLED=false is the way back
auth:
  sso:
    enabled: ${AUTH_SSO_ENABLED:true}
  password:
    enabled: ${AUTH_PASSWORD_ENABLED:false}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR}
