server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.kpmg.qtracker: INFO

spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  web:
    resources:
      static-locations: classpath:/static/
  mail:
    host: ${SPRING_MAIL_HOST:smtp.office365.com}
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  base-url: ${APP_BASE_URL:}

reminders:
  enabled: true

overdue:
  use-working-days: ${OVERDUE_USE_WORKING_DAYS:true}

notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
    whitelist-enforced: ${NOTIFICATIONS_EMAIL_WHITELIST_ENFORCED:false}
    whitelist: ${NOTIFICATIONS_EMAIL_WHITELIST:}

controls:
  auto-create:
    enabled: ${CONTROLS_AUTO_CREATE_ENABLED:true}
