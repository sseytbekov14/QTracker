server:
  port: ${SERVER_PORT:8080}
  # Whether to trust X-Forwarded-* (scheme, host, client address) from an HTTP proxy in front of the app. Today
  # there is none: a TCP port forward (netsh portproxy 443 -> 8081) and TLS ends in the app itself (server.ssl),
  # so the request already carries the real scheme and host and the headers are not sent - and must not be
  # trusted, anyone could send them. Set SERVER_FORWARD_HEADERS_STRATEGY=native (or framework) only when an
  # HTTP reverse proxy (IIS ARR, nginx, a load balancer) that ends TLS and sets these headers is put in front
  # (migration/analysis/8_sso_setup.md).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      # Signed out after 15 minutes without a request (every request starts the 15 minutes again)
      timeout: 15m
  tomcat:
    # Let Tomcat read an oversized upload so the client gets a JSON error instead of a connection reset
    max-swallow-size: 100MB

logging:
  level:
    root: INFO
    com.kpmg.qtracker: INFO

# No default profile: the start is refused without SPRING_PROFILES_ACTIVE=dev, stage or prod (StartupGuard)
spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${FILE_UPLOAD_MAX_REQUEST_SIZE_MB:100}MB
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: true
            required: true
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

app:
  base-url: ${APP_BASE_URL:}
  # The one site address (host only, e.g. kzqtracker.go1.kworld.kpmg.com): a request on any other name of the
  # server gets 301 to https://<this host> with the same path and query before SAML starts
  # (CanonicalHostRedirectFilter); empty: off. localhost and 127.0.0.1 are never redirected
  canonical-host: ${APP_CANONICAL_HOST:}

auth:
  # How people sign in (AuthMode): exactly one of SSO (Microsoft Entra ID, SAML) and the password form.
  # The profiles give their own defaults (prod: SSO; dev and stage: the password); the variables override them.
  sso:
    enabled: ${AUTH_SSO_ENABLED:false}
    # SAML 2.0 with Microsoft Entra ID (SamlConfig), read only with SSO on, no defaults: the Identifier of the
    # Entra application, its Reply URL (https://<site>/login/saml2/sso/entra) and its App Federation Metadata Url
    entity-id: ${SAML_ENTITY_ID:}
    acs-url: ${SAML_ACS_URL:}
    metadata-uri: ${SAML_METADATA_URI:}
    # GET /me: the signed-in person's own SAML claims, for checking the Entra claims on stage; off by default,
    # a WARN at start when on in prod
    debug-endpoint: ${AUTH_SSO_DEBUG_ENDPOINT:false}
  password:
    enabled: ${AUTH_PASSWORD_ENABLED:true}
  logout:
    # The Logout link and /logout; off unless true (no Logout in QTracker, decision of 2026-10-16)
    enabled: ${AUTH_LOGOUT_ENABLED:}
  # The domain of the addresses the user import gives people: <username>@<domain>
  username-domain: ${AUTH_USERNAME_DOMAIN:qtracker.local}
  username-login:
    # The login form also takes a username (the domain is added); off: e-mail only
    enabled: ${AUTH_USERNAME_LOGIN_ENABLED:false}

# Too many requests answer 429 (RateLimitingFilter): per window, sign-ins per name typed and address together,
# the rest per signed-in user (behind the port forward all clients share one address)
rate-limit:
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  login: ${RATE_LIMIT_LOGIN:20}
  api-write: ${RATE_LIMIT_API_WRITE:120}
  user-list: ${RATE_LIMIT_USER_LIST:120}
  heavy: ${RATE_LIMIT_HEAVY:20}

file:
  upload:
    # Folder of the attachments. Give FILE_UPLOAD_DIR as an absolute path. Without it the "uploads" folder of
    # the folder the app is started from is used, so the IDE and a jar started elsewhere would not share files.
    # The folder in use is written to the log at start.
    dir: ${FILE_UPLOAD_DIR:}
    max-file-size-mb: ${FILE_UPLOAD_MAX_FILE_SIZE_MB:10}

reminders:
  enabled: true

overdue:
  use-working-days: ${OVERDUE_USE_WORKING_DAYS:true}

notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
    from: ${NOTIFICATIONS_EMAIL_FROM:}
    whitelist-enforced: ${NOTIFICATIONS_EMAIL_WHITELIST_ENFORCED:false}
    whitelist: ${NOTIFICATIONS_EMAIL_WHITELIST:}

dev:
  # DevUserSeeder: the made-up test accounts (soqm1@qtracker.local, ...) in dev and stage; off: only the people
  # of the user import
  seed-users: ${DEV_SEED_USERS:false}

# Swagger UI and the API description: off unless SPRINGDOC_ENABLED=true (on in the dev profile); when on,
# only for people who are signed in (SecurityConfig)
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

controls:
  auto-create:
    enabled: ${CONTROLS_AUTO_CREATE_ENABLED:true}
    