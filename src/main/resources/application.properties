spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=8080
logging.level.com.kpmg.qtracker=INFO

spring.web.resources.static-locations=classpath:/static/
spring.sql.init.mode=always

# Mail Configuration (Office 365 / Outlook)
spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base URL for absolute links in notifications (set to your app URL)
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Enable reminders explicitly per environment when needed
reminders.enabled=true
overdue.use-working-days=${OVERDUE_USE_WORKING_DAYS:true}
notifications.email.enabled=false
controls.auto-create.enabled=${CONTROLS_AUTO_CREATE_ENABLED:true}

# File Upload Configuration
file.upload.dir=${FILE_UPLOAD_DIR:C:/Sultan/Projects/QTracker/uploads}
