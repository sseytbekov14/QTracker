<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Фрагмент для комментариев workflow -->
<div th:fragment="workflow-comments(controlId)" class="workflow-comments mt-4">
    <h6 class="mb-3">💬 Workflow Comments</h6>

    <!-- Список комментариев -->
    <div id="commentsList" class="mb-3" style="max-height: 300px; overflow-y: auto;">
        <!-- Комментарии будут загружены через JS -->
        <div class="text-center py-3 text-muted">
            <div class="spinner-border spinner-border-sm"></div>
            Loading comments...
        </div>
    </div>

    <!-- Форма для нового комментария -->
    <div th:if="${workflowStatus?.canApprove or workflowStatus?.canEdit}"
         class="mt-3">
      <textarea id="newComment" class="form-control form-control-sm"
                placeholder="Add your comment..." rows="2"></textarea>
        <button onclick="addWorkflowComment()" class="btn btn-outline-primary btn-sm mt-2">
            <i class="bi bi-chat"></i> Add Comment
        </button>
    </div>
</div>
</body>
</html>
