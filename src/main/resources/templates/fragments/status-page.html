<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Card for the error pages and "Control Not Available": no sidebar, one way back to the Dashboard.
  Usage: <main th:replace="~{fragments/status-page :: card('bi-search', 'Page not found', 'Text')}"></main>
  Styles: .status-page in style.css.
-->
<main th:fragment="card(icon, title, text)" class="status-page">
    <section class="status-card" aria-labelledby="statusTitle">
        <div class="status-brand">
            <img src="/images/kpmg_blue.png" alt="KPMG">
            <span>QTracker</span>
        </div>
        <div class="status-icon" aria-hidden="true"><i class="bi" th:classappend="${icon}"></i></div>
        <h1 id="statusTitle" th:text="${title}">Page not found</h1>
        <p th:text="${text}">The page you are looking for does not exist.</p>
        <a class="status-btn" href="/">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>Back to Dashboard
        </a>
    </section>
</main>
</body>
</html>
