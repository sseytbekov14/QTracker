<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  The sections of the Admin Panel: Users (people and access), Audit trail (who changed what) and E-mails (which e-mail
  went to whom).
  Usage: <div th:replace="~{fragments/admin-tabs :: tabs('users')}"></div>
-->
<nav th:fragment="tabs(active)" class="admin-tabs" aria-label="Admin Panel sections">
    <a href="/admin/users" class="admin-tab" th:classappend="${active == 'users'} ? 'is-active'"
       th:attr="aria-current=${active == 'users'} ? 'page' : null">
        <i class="bi bi-people" aria-hidden="true"></i>Users
    </a>
    <a href="/admin/audit" class="admin-tab" th:classappend="${active == 'audit'} ? 'is-active'"
       th:attr="aria-current=${active == 'audit'} ? 'page' : null">
        <i class="bi bi-clock-history" aria-hidden="true"></i>Audit trail
    </a>
    <a href="/admin/emails" class="admin-tab" th:classappend="${active == 'emails'} ? 'is-active'"
       th:attr="aria-current=${active == 'emails'} ? 'page' : null">
        <i class="bi bi-envelope" aria-hidden="true"></i>E-mails
    </a>
</nav>
</body>
</html>
