<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - QTracker'">Access is not granted - QTracker</title>
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/css/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css?v=19" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="theme-light">
<!--
  After the sign-in with Microsoft (AuthController): "Access is not granted" (no account, disabled, ...) without
  any detail and without a way back, "Sign-in did not complete" with Try again, or "Signed out of QTracker".
-->
<main class="status-page">
    <section class="status-card" aria-labelledby="statusTitle">
        <div class="status-brand">
            <img src="/images/kpmg_blue.png" alt="KPMG">
            <span>QTracker</span>
        </div>
        <div class="status-icon" aria-hidden="true">
            <i class="bi" th:classappend="${retry} ? 'bi-arrow-repeat' : 'bi-shield-lock'"></i>
        </div>
        <h1 id="statusTitle" th:text="${title}">Access is not granted</h1>
        <p th:text="${text}">Access is not granted, contact SoQM Admin Team.</p>
        <a th:if="${retry}" class="status-btn" href="/">
            <i class="bi bi-arrow-repeat" aria-hidden="true"></i><span th:text="${action} ?: 'Try again'">Try again</span>
        </a>
    </section>
</main>
</body>
</html>
