<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - QTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css?v=2" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2300338D' rx='15'/><text x='50' y='72' font-family='Arial, sans-serif' font-size='70' text-anchor='middle' fill='white' font-weight='bold'>Q</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .login-card {
            background: white;
            padding: 2.25rem 1.75rem;
            border-radius: 1.1rem;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        
        .kpmg-logo-img {
            height: 50px;
            width: auto;
            margin-bottom: 1rem;
        }
        
        .kpmg-title {
            color: #00338D;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.4px;
            margin-bottom: 0.2rem;
        }
        
        .kpmg-subtitle {
            color: #666;
            font-size: 0.82rem;
            font-weight: 400;
        }
        
        .form-label {
            color: #333;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            text-transform: capitalize;
        }
        
        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 0.45rem;
            padding: 0.6rem 0.85rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        
        .form-control::placeholder {
            color: #999;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.7rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 0.45rem;
            color: white;
            transition: all 0.3s ease;
            margin-top: 0.6rem;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.28);
        }
        
        .btn-login:hover {
            background: linear-gradient(135deg, #5568d3 0%, #6a3f92 100%);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
            color: white;
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-message {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 0.65rem 0.9rem;
            border-radius: 0.45rem;
            margin-top: 0.8rem;
            font-size: 0.85rem;
        }
        
        .login-footer {
            position: absolute;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            z-index: 1;
        }
        
        .login-footer small {
            font-size: 0.8rem;
            line-height: 1.45;
        }
        
        .login-footer strong {
            display: block;
            margin: 0.25rem 0;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo-section">
            <h1 class="kpmg-title">KPMG QTracker</h1>
            <p class="kpmg-subtitle">Quality Control Management System</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required
                       placeholder="Enter your username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required
                       placeholder="Enter your password">
            </div>
            <div th:if="${error}" class="error-message" th:text="${error}"></div>

            <div class="d-grid">
                <button type="submit" class="btn btn-login">Login</button>
            </div>
        </form>
    </div>

    <div class="login-footer">
        <small>
            Registered to<br>
            <strong>KPMG Kazakhstan</strong><br>
            QTracker | Version 2026
        </small>
    </div>
</div>
</body>
</html>
