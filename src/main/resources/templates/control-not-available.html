<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control Not Available - QTracker</title>
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/css/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css?v=12" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<script>
(function() {
    // One light theme; a dark theme saved by the former switch is dropped
    document.body.classList.add('theme-light');
    try {
        localStorage.removeItem('qtrackerTheme');
    } catch (error) {
        // Storage may be blocked; nothing is read from it
    }
})();
</script>
<main th:replace="~{fragments/status-page :: card('bi-hourglass-split', 'Control Not Available Yet', 'This control is still in Draft and has not been initiated into the workflow. You will get access after it is initiated.')}"></main>
</body>
</html>
