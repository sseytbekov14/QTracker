<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Not Available Yet</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f6fa;
            color: #1f2937;
        }
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            max-width: 640px;
            width: 100%;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin: 0 0 16px;
            font-size: 28px;
            line-height: 1.2;
            color: #00338d;
        }
        p {
            margin: 0 0 24px;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #00338d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
        }
        .btn:hover {
            background: #00256b;
        }
    </style>
</head>
<body>
<main class="page">
    <section class="card">
        <h1>Control Not Available Yet</h1>
        <p>
            This control is still in Draft and has not been initiated into the workflow.
            You will get access after it is initiated.
        </p>
        <a class="btn" href="/controls">Back to Controls</a>
    </section>
</main>
</body>
</html>
