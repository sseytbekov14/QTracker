<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Control - QTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css?v=7" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --kpmg-blue: #00338D;
            --kpmg-blue-light: #005EB8;
            --kpmg-blue-dark: #002060;
            --kpmg-green: #009a44;
            --kpmg-red: #c8102e;
            --kpmg-gray-50: #f8f9fa;
            --kpmg-gray-100: #f0f1f3;
            --kpmg-gray-200: #e2e4e8;
            --kpmg-gray-300: #cdd0d6;
            --kpmg-gray-500: #8b90a0;
            --kpmg-gray-700: #495057;
            --kpmg-gray-800: #343a40;
        }

        body {
            background: var(--kpmg-gray-50);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .page-wrapper {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px 20px;
        }

        /* ── Page Header ── */
        .page-header {
            background: var(--kpmg-blue);
            color: #fff;
            padding: 14px 28px;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .page-header-icon {
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .page-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .page-header p {
            margin: 2px 0 0 0;
            font-size: 0.78rem;
            opacity: 0.8;
        }

        /* ── Form Card ── */
        .form-card {
            background: #fff;
            border: 1px solid var(--kpmg-gray-200);
            border-top: none;
            border-radius: 0 0 6px 6px;
        }

        .form-card .card-body {
            padding: 18px 28px 14px !important;
        }

        /* ── Section Headers ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--kpmg-blue);
        }

        .section-icon {
            width: 24px;
            height: 24px;
            background: var(--kpmg-blue);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--kpmg-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* ── Section Divider ── */
        .section-divider {
            border: none;
            border-top: 1px solid var(--kpmg-gray-200);
            margin: 12px 0;
        }

        /* ── Form Controls ── */
        .form-label {
            font-weight: 600;
            color: var(--kpmg-gray-700);
            font-size: 0.73rem;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .form-control,
        .form-select {
            border: 1px solid var(--kpmg-gray-300);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.82rem;
            color: var(--kpmg-gray-800);
            transition: border-color 0.2s;
            background-color: #fff;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--kpmg-blue);
            box-shadow: 0 0 0 2px rgba(0, 51, 141, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: var(--kpmg-gray-500);
        }

        .form-control.is-invalid,
        .form-select.is-invalid {
            border-color: var(--kpmg-red);
            box-shadow: 0 0 0 2px rgba(200, 16, 46, 0.08);
        }

        textarea.form-control {
            min-height: 60px;
            resize: vertical;
        }

        /* ── Control ID field ── */
        .control-id-wrapper {
            position: relative;
        }

        .control-id-wrapper .form-control {
            font-weight: 600;
            color: var(--kpmg-blue);
            letter-spacing: 0.3px;
        }

        .control-id-hint {
            font-size: 0.7rem;
            color: var(--kpmg-gray-500);
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .control-id-hint svg {
            width: 12px;
            height: 12px;
        }

        /* ── Required fields note ── */
        .required-note {
            font-size: 0.75rem;
            color: var(--kpmg-red);
            font-weight: 600;
        }

        /* ── Row gap ── */
        .form-row {
            margin-bottom: 8px;
        }

        .mb-field {
            margin-bottom: 8px;
        }

        /* ── Buttons ── */
        .btn-kpmg-primary {
            background: var(--kpmg-blue);
            border: none;
            padding: 8px 22px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 4px;
            color: #fff;
            transition: background 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-kpmg-primary:hover {
            background: var(--kpmg-blue-dark);
            color: #fff;
        }

        .btn-kpmg-primary:disabled {
            background: var(--kpmg-gray-300);
            color: var(--kpmg-gray-500);
        }

        .btn-kpmg-secondary {
            background: #fff;
            border: 1px solid var(--kpmg-gray-300);
            padding: 8px 22px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 4px;
            color: var(--kpmg-gray-700);
            transition: all 0.2s;
        }

        .btn-kpmg-secondary:hover {
            border-color: var(--kpmg-blue);
            color: var(--kpmg-blue);
            background: var(--kpmg-gray-50);
        }

        /* ── Breadcrumb ── */
        .page-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.76rem;
            color: var(--kpmg-gray-500);
        }

        .page-breadcrumb a {
            color: var(--kpmg-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .page-breadcrumb a:hover {
            text-decoration: underline;
        }

        .page-breadcrumb .separator {
            color: var(--kpmg-gray-300);
        }

        /* ── Footer actions ── */
        .form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--kpmg-gray-200);
        }

        body.theme-dark {
            background: var(--app-bg);
            color: var(--text-primary);
        }

        body.theme-dark .page-wrapper {
            color: var(--text-primary);
        }

        body.theme-dark .page-breadcrumb {
            color: var(--text-secondary);
        }

        body.theme-dark .page-breadcrumb a {
            color: var(--link);
        }

        body.theme-dark .page-breadcrumb .separator,
        body.theme-dark .control-id-hint,
        body.theme-dark .form-label {
            color: var(--text-secondary) !important;
        }

        body.theme-dark .form-card {
            background: var(--surface-bg);
            border-color: var(--border);
        }

        body.theme-dark .section-divider,
        body.theme-dark .form-footer {
            border-color: var(--divider);
        }

        body.theme-dark .section-title {
            color: var(--card-title, var(--text-primary));
        }

        body.theme-dark .form-control,
        body.theme-dark .form-select {
            background-color: var(--input-bg);
            color: var(--input-text);
            border-color: var(--border);
        }

        body.theme-dark .form-control:focus,
        body.theme-dark .form-select:focus {
            border-color: var(--link);
            box-shadow: 0 0 0 2px rgba(127, 176, 255, 0.15);
        }

        body.theme-dark .form-control::placeholder {
            color: var(--text-secondary);
        }

        body.theme-dark .control-id-wrapper .form-control {
            color: var(--link);
        }

        body.theme-dark .btn-kpmg-secondary {
            background: var(--surface-bg-2);
            border-color: var(--border);
            color: var(--text-primary);
        }

        body.theme-dark .btn-kpmg-secondary:hover {
            border-color: var(--link);
            color: var(--link);
            background: var(--hover-bg);
        }

        body.theme-dark .btn-kpmg-primary:disabled {
            background: var(--surface-bg-2);
            color: var(--text-secondary);
        }
    </style>
</head>

})();

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app-modal.js?v=3"></script>

    <script>
        function getRequiredFieldLabel(field) {
            const label = field.closest('.mb-field')?.querySelector('label')
                       || field.closest('.mb-3')?.querySelector('label');
            if (label) {
                return label.textContent.replace('*', '').trim();
            }
            return field.name || 'Field';
        }

        // ★ Auto-generate Control ID from Component + Frequency
        function autoGenerateControlId() {
            const component = document.getElementById('component').value;
            const frequency = document.getElementById('controlFrequency').value;
            const controlIdInput = document.getElementById('controlId');

            if (!component || !frequency) {
                controlIdInput.value = '';
                controlIdInput.placeholder = 'Select Component & Frequency';
                return;
            }

            controlIdInput.value = 'Generating...';

            fetch(`/api/controls/generate-id?component=${encodeURIComponent(component)}&frequency=${encodeURIComponent(frequency)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.controlId) {
                        controlIdInput.value = data.controlId;
                        controlIdInput.classList.remove('is-invalid');
                    } else {
                        controlIdInput.value = '';
                        controlIdInput.placeholder = data.error || 'Error generating ID';
                    }
                })
                .catch(err => {
                    console.error('Error generating Control ID:', err);
                    controlIdInput.value = '';
                    controlIdInput.placeholder = 'Error generating ID';
                });
        }

        function showRequiredFieldAlert(message, field) {
            if (window.showAppModal) {
                showAppModal({
                    variant: 'warning',
                    title: 'Missing Required Field',
                    message: message,
                    autoCloseMs: 0
                });
            } else {
                alert(message);
            }
            if (field && typeof field.focus === 'function') {
                field.focus();
            }
        }

        function validateRequiredFormFields(form) {
            const requiredFields = Array.from(form.querySelectorAll('[required]'));
            let firstInvalid = null;

            requiredFields.forEach(field => {
                field.classList.remove('is-invalid');
            });

            requiredFields.forEach(field => {
                const value = field.value;
                if (value === null || value === undefined || String(value).trim() === '') {
                    field.classList.add('is-invalid');
                    if (!firstInvalid) {
                        firstInvalid = field;
                    }
                }
            });

            if (firstInvalid) {
                const label = getRequiredFieldLabel(firstInvalid);
                showRequiredFieldAlert(`${label} is required.`, firstInvalid);
                return false;
            }

            return true;
        }

        document.getElementById('controlForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!validateRequiredFormFields(this)) {
                return;
            }

            const formData = new FormData(this);
            const jsonData = {};
            formData.forEach((value, key) => {
                jsonData[key] = value;
            });

            // Convert roles to arrays
            jsonData.facilitator = jsonData.facilitator ? [jsonData.facilitator] : [];
            jsonData.controlOperator = jsonData.controlOperator ? [jsonData.controlOperator] : [];
            jsonData.soqmLead = jsonData.soqmLead ? [jsonData.soqmLead] : [];
            jsonData.processOwner = jsonData.processOwner ? [jsonData.processOwner] : [];

            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            fetch('/api/controls', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) throw data;
                return data;
            })
            .then(data => {
                showAppModal({
                    variant: 'success',
                    title: 'Created Successfully',
                    message: 'New control has been created',
                    redirectUrl: '/'
                });
            })
            .catch(errorData => {
                if (errorData.error === 'DUPLICATE_ID') {
                    showAppModal({
                        variant: 'warning',
                        title: 'Control ID Already Exists',
                        message: `<div><p><strong>"${errorData.controlId}"</strong> is already in use.</p><p>Please use a different Control ID.</p></div>`,
                        allowHtml: true,
                        autoCloseMs: 0,
                        onClose: () => {
                            const controlIdInput = document.getElementById('controlId');
                            if (controlIdInput) {
                                controlIdInput.focus();
                                controlIdInput.select();
                            }
                        }
                    });
                } else {
                    showAppModal({
                        variant: 'error',
                        title: 'Creation Failed',
                        message: errorData.message || 'Error creating control',
                        autoCloseMs: 0
                    });
                }

                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            });
        });
    </script>
</body>
</html>
