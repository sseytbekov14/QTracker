<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications - QTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css?v=7" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2300338D' rx='15'/><text x='50' y='72' font-family='Arial, sans-serif' font-size='70' text-anchor='middle' fill='white' font-weight='bold'>Q</text></svg>">
    <style>
:root {
    --kpmg-blue: #00338D;
    --kpmg-blue-light: #005EB8;
    --kpmg-blue-dark: #002060;
    --kpmg-gray-50: #f7f8fa;
    --kpmg-gray-100: #eef0f4;
    --kpmg-gray-200: #d8dce5;
    --kpmg-gray-300: #cdd0d6;
    --kpmg-gray-400: #9ba3b5;
    --kpmg-gray-500: #8b90a0;
    --kpmg-gray-600: #5c6478;
    --kpmg-gray-700: #495057;
    --kpmg-gray-800: #2d3340;
    --kpmg-white: #ffffff;
    --kpmg-green: #009a44;
    --kpmg-red: #c8102e;
    --kpmg-amber: #d4a843;
}

body {
    background: var(--app-bg);
    color: var(--text-primary);
    margin: 0;
    padding: 0;
}

.page-wrapper {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 20px;
    color: var(--text-primary);
}

/* ── Breadcrumb ── */
.page-breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 0.76rem;
    color: var(--text-secondary);
}

.page-breadcrumb a {
    color: var(--link);
    text-decoration: none;
    font-weight: 500;
}

.page-breadcrumb a:hover {
    text-decoration: underline;
}

.page-breadcrumb .separator {
    color: var(--muted);
}

/* ── Page Header ── */
.page-header {
    background: var(--kpmg-blue);
    color: var(--kpmg-white);
    padding: 16px 28px;
    border-radius: 6px 6px 0 0;
    border-bottom: 3px solid var(--kpmg-blue-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.page-header-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.page-header-icon {
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.page-header h2 {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.3px;
}

.page-header p {
    margin: 2px 0 0 0;
    font-size: 0.76rem;
    color: rgba(255,255,255,0.65);
}

.btn-mark-read {
    font-size: 0.76rem;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.4);
    background: transparent;
    color: var(--kpmg-white);
    cursor: pointer;
    transition: all 0.2s;
}

.btn-mark-read:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.7);
}

/* ── Card wrapper ── */
.notif-list-card {
    background: var(--surface-bg);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    padding: 0;
}

/* ── Empty state ── */
.notif-empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-secondary);
}

.notif-empty-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 12px;
    color: var(--muted);
}

.notif-empty-title {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
}

.notif-empty-text {
    font-size: 0.78rem;
    color: var(--text-secondary);
}

/* ── Group header ── */
.notif-group-date {
    padding: 10px 28px;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--surface-bg-2);
    border-bottom: 1px solid var(--divider);
}

.notif-group-date:first-child {
    border-radius: 0;
}

/* ── Notification item ── */
.notif-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 28px;
    background: var(--surface-bg);
    border-bottom: 1px solid var(--divider);
    text-decoration: none;
    color: var(--text-primary);
    transition: background 0.15s;
    cursor: pointer;
}

.notif-item:last-child {
    border-bottom: none;
}

.notif-item:hover {
    background: var(--hover-bg);
}

.notif-item.unread {
    border-left: 3px solid var(--kpmg-blue);
    background: #f0f4ff;
    padding-left: 25px;
}

.notif-item.unread .notif-item-message {
    font-weight: 700;
    color: var(--text-primary);
}

/* Item badge area */
.notif-item-badge {
    min-width: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    padding-top: 2px;
}

.notif-item-component {
    font-size: 0.7rem;
    color: var(--text-secondary);
    font-weight: 500;
}

/* Type badges */
.type-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 3px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
}

.type-activated {
    background: #e3f2fd;
    color: #1565c0;
    border: 1px solid #bbdefb;
}

.type-reminder {
    background: #fff8e1;
    color: #f57f17;
    border: 1px solid #fff3c4;
}

.type-overdue {
    background: #ffebee;
    color: var(--kpmg-red);
    border: 1px solid #ffcdd2;
}

.type-completed {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #c8e6c9;
}

.type-auto-created {
    background: #f3e5f5;
    color: #7b1fa2;
    border: 1px solid #e1bee7;
}

.type-default {
    background: var(--surface-bg-2);
    color: var(--text-secondary);
    border: 1px solid var(--border);
}

/* Item content */
.notif-item-content {
    flex: 1;
    min-width: 0;
}

.notif-item-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
}

.notif-item-message {
    font-size: 0.85rem;
    color: var(--text-primary);
    font-weight: 500;
}

.notif-item-time {
    font-size: 0.75rem;
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
}

.notif-item-meta {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 3px;
}

.notif-item-meta .ctrl-id {
    font-weight: 600;
    color: var(--text-secondary);
}

.notif-item-meta .dot {
    margin: 0 6px;
    color: var(--muted);
}

/* Right side */
.notif-item-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
    padding-top: 2px;
}

.new-badge {
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    background: #fff8e1;
    color: var(--kpmg-amber);
    border: 1px solid #fff3c4;
}

.view-link {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--link);
}

body.theme-dark .notif-item.unread {
    background: rgba(0, 94, 184, 0.14);
}

body.theme-dark .type-activated {
    background: #1565c0;
    color: #ffffff;
    border-color: #1565c0;
}

body.theme-dark .type-reminder {
    background: #f59f00;
    color: #ffffff;
    border-color: #f59f00;
}

body.theme-dark .type-overdue {
    background: var(--kpmg-red);
    color: #ffffff;
    border-color: var(--kpmg-red);
}

body.theme-dark .type-completed {
    background: #2e7d32;
    color: #ffffff;
    border-color: #2e7d32;
}

body.theme-dark .type-auto-created {
    background: #7b1fa2;
    color: #ffffff;
    border-color: #7b1fa2;
}

body.theme-dark .type-default,
body.theme-dark .new-badge {
    background: var(--surface-bg-2);
    color: var(--text-secondary);
    border-color: var(--border);
}

body.theme-dark .notif-list-card,
body.theme-dark .notif-item {
    background: var(--surface-bg) !important;
    color: var(--text-primary) !important;
    border-color: var(--border) !important;
}

body.theme-dark .notif-group-date {
    background: var(--surface-bg-2) !important;
    color: var(--text-secondary) !important;
    border-bottom-color: var(--divider) !important;
}

body.theme-dark .notif-item:hover {
    background: var(--hover-bg) !important;
}

body.theme-dark .notif-item-message {
    color: var(--text-primary) !important;
}

body.theme-dark .notif-item-component,
body.theme-dark .notif-item-time,
body.theme-dark .notif-item-meta,
body.theme-dark .notif-item-meta .ctrl-id {
    color: var(--text-secondary) !important;
}

body.theme-dark .notif-item-meta .dot,
body.theme-dark .page-breadcrumb .separator {
    color: var(--muted) !important;
}
    </style>
</head>
<body>
<script>
(function() {
    try {
        var savedTheme = localStorage.getItem('qtrackerTheme');
        document.body.classList.add(savedTheme === 'dark' ? 'theme-dark' : 'theme-light');
    } catch (error) {
        document.body.classList.add('theme-light');
    }
})();
</script>
<div class="page-wrapper">

    <!-- Breadcrumb -->
    <nav class="page-breadcrumb">
        <a href="/#action-centre">Dashboard</a>
        <span class="separator">/</span>
        <span>Notifications</span>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="page-header-left">
            <div class="page-header-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 01-3.46 0"/>
                </svg>
            </div>
            <div>
                <h2>Notifications</h2>
                <p>Stay updated with your control activities</p>
            </div>
        </div>
        <form method="post" action="/notifications/mark-all-read" class="m-0">
            <button type="submit" class="btn-mark-read">✓ Mark all as read</button>
        </form>
    </div>

    <!-- Notification List -->
    <div class="notif-list-card">

        <!-- Empty state -->
        <div th:if="${notificationGroups == null or #lists.isEmpty(notificationGroups)}" class="notif-empty">
            <div class="notif-empty-icon">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 01-3.46 0"/>
                </svg>
            </div>
            <div class="notif-empty-title">No notifications yet</div>
            <div class="notif-empty-text">You're all caught up!</div>
        </div>

        <!-- Groups -->
        <div th:if="${notificationGroups != null and !#lists.isEmpty(notificationGroups)}">
            <div th:each="group : ${notificationGroups}">

                <!-- Date Group Header -->
                <div class="notif-group-date"
                     th:text="${!#lists.isEmpty(group.notifications) and group.notifications[0].timestamp != null ? #temporals.format(group.notifications[0].timestamp, 'dd.MM.yyyy') : group.dateLabel}">
                    23.02.2026
                </div>

                <!-- Notifications in this group -->
                <a th:each="n : ${group.notifications}"
                   th:href="@{/notification/{id}(id=${n.id})}"
                   class="notif-item"
                   th:classappend="${!n.read} ? 'unread' : ''">

                    <!-- Left: Badge + component -->
                    <div class="notif-item-badge">
                        <span th:switch="${n.badgeClass}">
                            <span th:case="'badge-activated'" class="type-badge type-activated" th:text="${n.displayLabel}">Activated</span>
                            <span th:case="'badge-reminder'" class="type-badge type-reminder" th:text="${n.displayLabel}">Reminder</span>
                            <span th:case="'badge-overdue'" class="type-badge type-overdue" th:text="${n.displayLabel}">Overdue</span>
                            <span th:case="'badge-completed'" class="type-badge type-completed" th:text="${n.displayLabel}">Completed</span>
                            <span th:case="'badge-auto-created'" class="type-badge type-auto-created" th:text="${n.displayLabel}">Auto Created</span>
                            <span th:case="*" class="type-badge type-default" th:text="${n.displayLabel}">Notification</span>
                        </span>
                        <span class="notif-item-component" th:text="${n.component}">HR</span>
                    </div>

                    <!-- Center: Message + meta -->
                    <div class="notif-item-content">
                        <div class="notif-item-top">
                            <div class="notif-item-message" th:text="${n.message}">Message</div>
                            <div class="notif-item-time" th:text="${n.timestamp != null ? #temporals.format(n.timestamp, 'h:mm a') : ''}">3:15 PM</div>
                        </div>
                        <div class="notif-item-meta">
                            <span class="ctrl-id" th:text="${n.controlIdNumber}">CTRL-000</span>
                            <span class="dot">·</span>
                            <span th:text="${n.by}">User</span>
                        </div>
                    </div>

                    <!-- Right: New badge + View -->
                    <div class="notif-item-right">
                        <span th:if="${!n.read}" class="new-badge">New</span>
                        <span class="view-link">View</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
