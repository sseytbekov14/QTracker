<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications - QTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css?v=2" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2300338D' rx='15'/%3E%3Ctext x='50' y='72' font-family='Arial, sans-serif' font-size='70' text-anchor='middle' fill='white' font-weight='bold'%3EQ%3C/text%3E%3C/svg%3E">
    <style>
        .notification-group-section {
            margin-bottom: 2rem;
        }
        
        .notification-group-header {
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            margin-bottom: 0.75rem;
            margin-top: 1rem;
        }
        
        .notification-group-header:first-child {
            margin-top: 0;
        }
        
        .notification-item {
            border-left: 4px solid transparent;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            padding: 1rem;
            background: #ffffff;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .notification-item:hover {
            background: #f8f9fa;
            border-color: #0d6efd;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.1);
        }
        
        .notification-item.unread {
            border-left-color: #0d6efd;
            background: #f0f6ff;
            border-color: #0d6efd;
        }
        
        .notification-item.unread .notification-message {
            font-weight: 600;
            color: #212529;
        }
        
        .notification-badge {
            min-width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .notification-empty {
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .notification-badge-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .notification-component {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }
        
        .notification-meta {
            font-size: 0.875rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }
        
        .notification-time {
            font-size: 0.875rem;
            color: #6c757d;
            white-space: nowrap;
        }
        
        .notification-message {
            font-size: 0.95rem;
            color: #495057;
            transition: color 0.2s;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-3">
            <div class="sidebar-content">
                <div class="d-flex align-items-center mb-3">
                    <a href="/" class="me-2">
                        <img src="/images/kpmg_white.png" alt="KPMG" style="height: 45px; width: auto;">
                    </a>
                    <h6 class="mb-0" th:text="${userName}">Full Name</h6>
                </div>
                <small class="text-muted" th:text="${userTitle}">Title</small><br>
                <small class="text-muted" th:text="${userEmail}">email@kpmg.kz</small>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/controls">Controls</a></li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/notifications">
                            Notifications
                            <span th:if="${unreadNotifications != null and unreadNotifications > 0}"
                                  class="notif-pill"
                                  th:text="${unreadNotifications}">0</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="mt-2">
                <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
            </div>
            <div class="sidebar-footer">
                <hr class="my-2">
                <small class="text-muted">Register on</small><br>
                <small><strong>KPMG Kazakhstan</strong></small><br>
                <small><strong>QTracker Version 2025</strong></small>
            </div>
        </div>

        <div class="col-md-10">
            <div class="p-4">
                <!-- Enhanced Header -->
                <div class="dashboard-header-enhanced mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h1 class="mb-1">Notifications</h1>
                            <p class="mb-0 text-white-50">Stay updated with your control activities</p>
                        </div>
                        <form method="post" action="/notifications/mark-all-read" class="m-0">
                            <button type="submit" class="btn btn-light">✓ Mark all as read</button>
                        </form>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div th:if="${notificationGroups == null or #lists.isEmpty(notificationGroups)}" class="text-center text-muted py-5 notification-empty">
                            <div class="display-6 mb-3">🔔</div>
                            <div class="fw-semibold">No notifications yet</div>
                            <div class="small">You're all caught up!</div>
                        </div>

                        <div th:if="${notificationGroups != null and !#lists.isEmpty(notificationGroups)}">
                            <div th:each="group : ${notificationGroups}" class="notification-group-section">
                                <!-- Date Group Header -->
                                <div class="notification-group-header">
                                    <div class="text-muted small fw-semibold"
                                         th:text="${!#lists.isEmpty(group.notifications) and group.notifications[0].timestamp != null ? #temporals.format(group.notifications[0].timestamp, 'dd.MM.yyyy') : group.dateLabel}">
                                        4.2.2026
                                    </div>
                                </div>
                                
                                <!-- Notifications in this group -->
                                <div>
                                    <a th:each="n : ${group.notifications}"
                                       th:href="@{/notification/{id}(id=${n.id})}"
                                       class="notification-item d-flex align-items-start gap-3"
                                       th:classappend="${!n.read} ? 'unread' : ''"
                                       style="text-decoration: none; color: inherit;">
                                        
                                        <!-- Left side: Badge and component -->
                                        <div class="notification-badge flex-shrink-0">
                                            <span class="notification-type-badge"
                                                  th:classappend="${n.badgeClass}"
                                                  th:text="${n.displayLabel}">Notification</span>
                                            <div class="notification-component" th:text="${n.component}">Component</div>
                                        </div>
                                        
                                        <!-- Center: Message and meta -->
                                        <div class="flex-grow-1">
                                            <div class="d-flex justify-content-between align-items-baseline">
                                                <div class="notification-message" th:text="${n.message}">Message</div>
                                                <div class="notification-time flex-shrink-0 ms-2" th:text="${n.timestamp != null ? #temporals.format(n.timestamp, 'h:mm a') : ''}">Time</div>
                                            </div>
                                            <div class="notification-meta">
                                                <span class="fw-semibold" th:text="${n.controlIdNumber}">CTRL-000</span>
                                                <span class="mx-2">•</span>
                                                <span th:text="${n.by}">User</span>
                                            </div>
                                        </div>
                                        
                                        <!-- Right side: New badge and View -->
                                        <div class="flex-shrink-0 d-flex flex-column align-items-end gap-2">
                                            <span th:if="${!n.read}" class="badge bg-warning-subtle text-warning">New</span>
                                            <span class="text-primary small" style="font-weight: 500;">View</span>
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
