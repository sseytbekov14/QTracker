<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied - QTracker</title>
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/css/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css?v=13" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<script>
(function() {
    // One light theme; a dark theme saved by the former switch is dropped
    document.body.classList.add('theme-light');
    try {
        localStorage.removeItem('qtrackerTheme');
    } catch (error) {
        // Storage may be blocked; nothing is read from it
    }
})();
</script>
<!-- The message is ViewController's own (ForbiddenException); a 403 from Spring Security, e.g. after
     the session ended, has none and gets the general text -->
<main th:replace="~{fragments/status-page :: card('bi-shield-lock', ${title} ?: 'Access denied', ${message} ?: 'You do not have access to this page. If you were away for a while, sign in again.')}"></main>
</body>
</html>
