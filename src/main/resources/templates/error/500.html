<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <style>
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f5f6fa; color: #1f2937; }
        .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; max-width: 640px; width: 100%; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        h1 { margin: 0 0 12px; color: #00338d; font-size: 28px; }
        p { margin: 0 0 16px; line-height: 1.5; }
        .muted { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .btn { display: inline-block; text-decoration: none; background: #00338d; color: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 600; }
    </style>
</head>
<body>
<script>
(function() {
    // One light theme; a dark theme saved by the former switch is dropped
    document.body.classList.add('theme-light');
    try {
        localStorage.removeItem('qtrackerTheme');
    } catch (error) {
        // Storage may be blocked; nothing is read from it
    }
})();
</script>
<main class="page">
    <section class="card">
        <!-- General text only: the cause is in the server log, never on the page -->
        <h1>Something went wrong</h1>
        <p>The request could not be completed. Please try again; if it keeps happening, contact the QTracker team.</p>
        <a class="btn" href="/controls">Back to Controls</a>
    </section>
</main>
</body>
</html>
