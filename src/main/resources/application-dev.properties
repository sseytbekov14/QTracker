# Development defaults (no secrets committed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/QTracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.base-url=${APP_BASE_URL:http://localhost:8080}
reminders.enabled=true
notifications.email.enabled=false
controls.auto-create.enabled=${CONTROLS_AUTO_CREATE_ENABLED:true}
overdue.use-working-days=${OVERDUE_USE_WORKING_DAYS:true}

file.upload.dir=${FILE_UPLOAD_DIR:C:/Sultan/Projects/QTracker/uploads}

logging.level.root=INFO
logging.level.com.kpmg.qtracker.scheduler.ControlReminderScheduler=INFO
logging.level.com.kpmg.qtracker.service.ReminderNotificationService=DEBUG
logging.level.com.kpmg.qtracker.service.NotificationService=DEBUG
