# Development defaults (no secrets committed)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.base-url=${APP_BASE_URL:http://localhost:8080}
reminders.enabled=${REMINDERS_ENABLED:false}
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
controls.auto-create.enabled=${CONTROLS_AUTO_CREATE_ENABLED:false}
overdue.use-working-days=${OVERDUE_USE_WORKING_DAYS:true}

file.upload.dir=${FILE_UPLOAD_DIR:C:/Sultan/Projects/QTracker - Copy/uploads}
