spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  base-url: ${APP_BASE_URL}

# The password form until SSO is switched on here with AUTH_SSO_ENABLED=true and AUTH_PASSWORD_ENABLED=false
auth:
  sso:
    enabled: ${AUTH_SSO_ENABLED:false}
  password:
    enabled: ${AUTH_PASSWORD_ENABLED:true}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR}