components:
  securitySchemes:
    sessionAuth:
      description: Dev/local authentication via HTTP session cookie (JSESSIONID).
      type: apiKey
      in: cookie
      name: JSESSIONID
    oauth2:
      description: SSO authentication for ssodev/prod via OIDC Authorization Code flow.
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://sso-placeholder.example.local/oauth2/authorize
          tokenUrl: https://sso-placeholder.example.local/oauth2/token
          scopes:
            openid: OpenID scope placeholder
            profile: Profile scope placeholder
            email: Email scope placeholder
  parameters:
    ControlIdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          example: ACCESS_DENIED
        message:
          type: string
          example: Access denied
        correlationId:
          type: string
          example: 0f0d35e7-56f4-41af-8e2b-35d37b07f37b
    Control:
      type: object
      properties:
        id: { type: integer, format: int64 }
        controlId: { type: string }
        controlFrequency: { type: string }
        controlCategory: { type: string }
        controlType: { type: string }
        component: { type: string }
        controlStatus: { type: string }
        performanceStatus: { type: string }
        controlDescription: { type: string }
        soqmHeadComments: { type: string }
        processOwnerComments: { type: string }
    ControlDetails:
      type: object
      properties:
        controlId: { type: integer, format: int64 }
        processName: { type: string }
        department: { type: string }
        processActivities: { type: string }
        otherRelatedControls: { type: string }
        itApplications: { type: string }
        controlStepsPerformed: { type: string }
        soqmHeadComments: { type: string }
        processOwnerComments: { type: string }
    ControlAssignment:
      type: object
      properties:
        controlId: { type: integer, format: int64 }
        facilitator:
          type: array
          items: { type: string }
        controlOperator:
          type: array
          items: { type: string }
        soqmLead:
          type: array
          items: { type: string }
        processOwner:
          type: array
          items: { type: string }
        controlSharedWith:
          type: array
          items: { type: string }
        controlOperationDate:
          type: string
          format: date
        controlOperationDeadline:
          type: string
          format: date
        nextControlOperationDate:
          type: string
          format: date
    Performance:
      type: object
      properties:
        controlId: { type: integer, format: int64 }
        soqmYear: { type: string }
        actualOperationDate: { type: string, format: date }
        controlFrequency: { type: string }
        performanceStatus: { type: string }
    WorkflowAction:
      type: object
      properties:
        controlId: { type: integer, format: int64 }
        action: { type: string }
        comment: { type: string }
        comments: { type: string }
        returnReason: { type: string }
        returnToStep: { type: string }
    AttachmentMetadata:
      type: object
      properties:
        controlId: { type: integer, format: int64 }
        attachmentDetailsPath: { type: string }
        attachmentDocumentsPath: { type: string }
