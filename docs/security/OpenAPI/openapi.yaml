openapi: 3.0.3
info:
  title: QTracker API
  version: "1.0.0"
  description: Baseline OpenAPI specification for QTracker APIs.
  x-audit: OpenAPI required by KPMG API Security Standard
servers:
  - url: https://dev.example.local/qtracker
    description: Development
  - url: https://stage.example.local/qtracker
    description: Staging
  - url: https://prod.example.local/qtracker
    description: Production
tags:
  - name: controls
  - name: workflow
  - name: documents
  - name: notifications
  - name: attachments
security:
  - sessionAuth: []
  - oauth2: []
paths:
  /api/controls:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Get all controls
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Create control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Control"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/generate-id:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Generate control ID
      parameters:
        - in: query
          name: component
          required: true
          schema: { type: string }
        - in: query
          name: frequency
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/check-id-unique:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Check control ID uniqueness
      parameters:
        - in: query
          name: controlId
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/{id}/rename-id:
    security:
      - sessionAuth: []
      - oauth2: []
    post:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Rename control ID
      parameters:
        - $ref: "#/components/parameters/ControlIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newControlId:
                  type: string
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/user/{email}:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Get controls by user email
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/component/{component}:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Get controls by component
      parameters:
        - in: path
          name: component
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/{id}/changelog:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Get control changelog
      parameters:
        - $ref: "#/components/parameters/ControlIdPath"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/export/excel:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Export controls to Excel
      parameters:
        - in: query
          name: component
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: exportType
          schema: { type: string }
        - in: query
          name: userEmail
          schema: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/{id}:
    security:
      - sessionAuth: []
      - oauth2: []
    put:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Update control
      parameters:
        - $ref: "#/components/parameters/ControlIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Control"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Delete control
      parameters:
        - $ref: "#/components/parameters/ControlIdPath"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/controls/{id}/export/completed:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Export completed control
      parameters:
        - $ref: "#/components/parameters/ControlIdPath"
      responses:
        "200":
          description: Success
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/control-details:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Get control details
      parameters:
        - in: query
          name: controlId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Save control details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlDetails"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/control-assignment:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Get control assignment
      parameters:
        - in: query
          name: controlId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Save control assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlAssignment"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/control-documents:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Get control documents
      parameters:
        - in: query
          name: controlId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Save control documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlDetails"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/users/all:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Get all users
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/users/role/{role}:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [documents]
      summary: Get users by role
      parameters:
        - in: path
          name: role
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/dashboard/admin/status:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Admin dashboard status chart
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /api/dashboard/admin/component-breakdown:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Admin dashboard component breakdown
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /api/dashboard/admin/frequency:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Admin dashboard frequency chart
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /api/dashboard/admin/overdue-trend:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Admin dashboard overdue trend
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /api/dashboard/deadline-countdown:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Deadline countdown
      parameters:
        - in: query
          name: days
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /api/dashboard/deadline-calendar:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [controls]
      summary: Deadline calendar
      parameters:
        - in: query
          name: start
          schema: { type: string, format: date }
        - in: query
          name: end
          schema: { type: string, format: date }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /api/dashboard/my/frequency:
    security:
      - sessionAuth: []
      - oauth2: []
    get: { tags: [controls], summary: My frequency chart, responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } } }
  /api/dashboard/my/component:
    security:
      - sessionAuth: []
      - oauth2: []
    get: { tags: [controls], summary: My component chart, responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } } }
  /api/dashboard/my/overdue-trend:
    security:
      - sessionAuth: []
      - oauth2: []
    get: { tags: [controls], summary: My overdue trend chart, responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "429": { $ref: "#/components/responses/TooManyRequests" }, "500": { $ref: "#/components/responses/InternalServerError" } } }

  /api/attachments/upload/{controlId}:
    security:
      - sessionAuth: []
      - oauth2: []
    post:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [attachments]
      summary: Upload control attachments
      parameters:
        - $ref: "#/components/parameters/ControlIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachmentDetails:
                  type: array
                  items: { type: string, format: binary }
                attachmentDocuments:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/attachments/download/{filename}:
    security:
      - sessionAuth: []
      - oauth2: []
    get:
      security:
        - sessionAuth: []
        - oauth2: []
      tags: [attachments]
      summary: Download attachment
      parameters:
        - in: path
          name: filename
          required: true
          schema: { type: string }
        - in: query
          name: controlId
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
